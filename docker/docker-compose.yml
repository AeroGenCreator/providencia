services:
  providencia:
    build:
      context: .
      dockerfile: Dockerfile
    image: providencia:v1.0
    container_name: providencia_container
    restart: always
    env_file:
      - ../.env
    volumes:
      - ../db:/usr/share/providencia/db
      - ../private:/usr/share/providencia/private
    ports:
      - "${PORT}:${PORT}"
