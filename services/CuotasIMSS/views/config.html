<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/bulma/css/bulma.min.css">
    <link rel="stylesheet" href="/assets/css/saavedra/saavedra.css">
    <script src="https://kit.fontawesome.com/75d1a8fea1.js" crossorigin="anonymous"></script>
    <script defer src="/assets/src/utils/utils.js"></script>
    <script defer src="/assets/src/js/CuotasIMSS/cuotas_imss.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.3/dist/cdn.min.js"></script>
    <title></title>
</head>
<body x-data="CuotasConfigComponent">
<section class="block hero has-background-dark">
    <nav class="navbar">
        <div class="navbar-start">
            <div class="navbar-item">
                <span class="icon-text has-text-white is-size-7 clickable" @click="goHome" style="cursor: pointer;">
                    <span class="icon"><i class="fa-solid fa-house"></i></span><span>Home</span>
                </span>
            </div>
            <div class="navbar-item">
                <span class="icon-text has-text-white is-size-7 clickable" @click="goBack" style="cursor: pointer;">
                    <span class="icon"><i class="fa-solid fa-rotate-left"></i></span><span>Volver</span>
                </span>
            </div>
            <div class="navbar-item">
                <span class="icon-text has-text-white is-size-7">
                    <span class="icon"><i class="fa-solid fa-gear"></i></span><span>{{ .View1 }}</span>
                </span>
            </div>
        </div>
        <div class="navbar-end">
            <div class="navbar-item">
                <button class="button is-danger is-small" @click="logOut">
                    <span class="icon"><i class="fa-solid fa-arrow-right-from-bracket"></i></span>
                    <span>Cerrar Sesión</span>
                </button>
            </div>
        </div>
    </nav>
</section>
<main>
<section class="section">
<div class="container">
    <div class="columns is-centered">
        <div class="column is-two-thirds">
            <div class="box">
                <div class="columns is-multiline">
                    <!-- BOTONES -->
                    <div class="column is-12">
                        <div class="buttons is-right">
                            <button
                                class="button is-info is-small is-rounded"
                                @click="saveChanges"
                                :disabled="lock"
                            >
                                <span class="icon"><i class="fa-solid fa-circle-plus"></i></span>
                                <span>Guardar Cambios</span>
                            </button>
                        </div>
                    </div>
                    <!-- NOTIFICACIÓN ERRORES -->
                    <div class="column is-12" x-show="authError">
                        <div class="notification is-danger is-light">
                            <button class="delete" @click="close"></button>
                            <p class="has-text-left is-size-7">
                                <span class="icon-text">
                                    <span class="icon"><i class="fa-solid fa-triangle-exclamation"></i></span>
                                    <span>Su usuario no cuenta con permisos para esta modificación</span>
                                </span>
                            </p>
                        </div>
                    </div>
                    <!-- Intrucciones -->
                    <div class="column is-12">
                        <div class="notification is-primary is-light has-text-centered is-size-7">
                            <p>Todos los campos son obligatorios para guardar cambios.</p>
                        </div>
                    </div>
                    <!-- CAMPOS PARA EDITAR LA UMA -->
                    <div class="column is-6">
                        <label class="label is-small">UMA Actual</label>
                        <div class="control has-icons-left">
                            <input
                                class="input is-small"
                                type="text"
                                placeholder="150.50"
                                x-model="uma"
                                @blur="uma = currency($event.target.value)"
                            >
                            <span class="icon is-small is-left"><i class="fa-solid fa-coins"></i></span>
                        </div>
                    </div>
                    <div class="column is-6">
                        <label class="label is-small">Año Para La UMA</label>
                        <div class="control has-icons-left">
                            <input
                                class="input is-small"
                                type="text"
                                placeholder="2026"
                                x-model="umaYear"
                                @blur="umaYear = yearFormat($event.target.value)"
                            >
                            <span class="icon is-small is-left"><i class="fa-solid fa-calendar"></i></span>
                        </div>
                    </div>
                    <!-- CAMPOS PARA EDITAR SALARIO MÍNIMO -->
                    <div class="column is-6">
                        <label class="label is-small">Salario Minimo</label>
                        <div class="control has-icons-left">
                            <input
                                class="input is-small"
                                type="text"
                                placeholder="550.50"
                                x-model="salary"
                                @blur="salary = currency($event.target.value)"
                            >
                            <span class="icon is-small is-left"><i class="fa-solid fa-money-check-dollar"></i></span>
                        </div>
                    </div>
                    <div class="column is-6">
                        <label class="label is-small">Año Para el Salario Minimo</label>
                        <div class="control has-icons-left">
                            <input
                                class="input is-small"
                                type="text"
                                placeholder="2026"
                                x-model="salaryYear"
                                @blur="salaryYear = yearFormat($event.target.value)"
                            >
                            <span class="icon is-small is-left"><i class="fa-solid fa-calendar"></i></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</section>
</main>
</body>
</html>
