<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/bulma/css/bulma.min.css">
    <link rel="stylesheet" href="/assets/css/saavedra/saavedra.css">
    <script src="https://kit.fontawesome.com/75d1a8fea1.js" crossorigin="anonymous"></script>
    <script defer src="/assets/src/utils/utils.js"></script>
    <script defer src="/assets/src/js/CuotasIMSS/cuotas_imss.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.3/dist/cdn.min.js"></script>
    <title>{{ .Service }}</title>
</head>
<body x-data="CuotasIMSSNewComponent">
<section class="block hero has-background-dark">
    <nav class="navbar">
        <div class="navbar-start">
            <div class="navbar-item">
                <span class="icon-text has-text-white is-size-7 clickable" @click="goHome" style="cursor: pointer;">
                    <span class="icon"><i class="fa-solid fa-house"></i></span><span>Home</span>
                </span>
            </div>
            <div class="navbar-item">
                <span class="icon-text has-text-white is-size-7 clickable" @click="goBack" style="cursor: pointer;">
                    <span class="icon"><i class="fa-solid fa-rotate-left"></i></span><span>Volver</span>
                </span>
            </div>
            <div class="navbar-item">
                <span class="icon-text has-text-white is-size-7 clickable" @click="goBack">
                    <span class="icon"><i class="fa-solid fa-stethoscope"></i></span><span>Servicio {{ .Service }}</span>
                </span>
            </div>
            <div class="navbar-item">
                <span class="icon-text has-text-white is-size-7 clickable" @click="goCuotasIMSSNuevo">
                    <span class="icon"><i class="fa-regular fa-square-plus"></i></span><span>{{ .Nuevo }}</span>
                </span>
            </div>
        </div>
        <div class="navbar-end">
            <div class="navbar-item">
                <button class="button is-danger is-small" @click="logOut">
                    <span class="icon"><i class="fa-solid fa-arrow-right-from-bracket"></i></span>
                    <span>Cerrar Sesión</span>
                </button>
            </div>
        </div>
    </nav>
</section>
<main class="hero">
<section class="container">
    <div class="box">
        <div class="columns">
            <div class="column is-12">
                <div class="buttons">
                    <button class="button is-info is-small" @click="createRecord" :disabled="requiredCreate">
                        <span class="icon"><i class="fa-solid fa-floppy-disk"></i></span>
                        <span>Crear Registro</span>
                    </button>
                    <button class="button is-primary is-small" @click="calcularCuota" :disabled="requiredCalculate">
                        <span class="icon"><i class="fa-solid fa-calculator"></i></span>
                        <span>Calcular Cuota</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="columns">
            <div class="column is-12" x-show="authError">
                <div class="notification is-danger is-light">
                    <button class="delete" @click="close"></button>
                    <p class="has-text-left is-size-7">
                        <span class="icon-text">
                            <span class="icon"><i class="fa-solid fa-triangle-exclamation"></i></span>
                            <span>...</span>
                        </span>
                    </p>
                </div>
            </div>
        </div>
        <div class="columns is-multiline">
            <!-- PRIMERA LINEA DE INPUTS -->
            <div class="column is-2">
                <label class="label is-small">Empleado</label>
                <div class="control has-icons-left">
                    <input class="input is-small" list="list-employee" id="input-employee" placeholder="Buscar empleado..." x-model="selectedEmployee">
                    <span class="icon is-small is-left"><i class="fa-solid fa-helmet-safety"></i></span>
                    <datalist id="list-employee">
                        <template x-for="r in employee" :key="r.id">
                            <option :value="r.name" x-text="r.name"></option>
                        </template>
                    </datalist>
                </div>
            </div>
            <div class="column is-2">
                <label class="label is-small">Mes</label>
                <div class="control has-icons-left">
                    <input
                        class="input is-small"
                        list="list-month"
                        id="input-month"
                        placeholder="Seleccionar mes..."
                        x-model="selectedMonth"
                        @change="validarBimestre"
                    >
                    <span class="icon is-small is-left"><i class="fa-regular fa-calendar-days"></i></span>
                    <datalist id="list-month">
                        <template x-for="r in months">
                            <option :value="r" x-text="r"></option>
                        </template>
                    </datalist>
                </div>
            </div>
            <div class="column is-2">
                <label class="label is-small">Año</label>
                <div class="control has-icons-left">
                    <input
                        class="input is-small"
                        type="text"
                        placeholder="Ingresar año..."
                        x-model="selectedYear"
                        @blur="selectedYear = integer($event.target.value)"
                    >
                    <span class="icon is-small is-left"><i class="fa-solid fa-2"></i></span>
                </div>
            </div>
            <div class="column is-2">
                <label class="label is-small">Prima Riesgo</label>
                <div class="control has-icons-left">
                    <input
                        class="input is-small"
                        list="list-riesgo"
                        id="input-riesgo"
                        placeholder="Seleccionar prima de riesgo ..."
                        x-model="riesgo"
                        @blur="riesgo = float($event.target.value)"
                    >
                    <span class="icon is-small is-left"><i class="fa-solid fa-shield"></i></span>
                    <datalist id="list-riesgo">
                        <template x-for="r in riesgos">
                            <option :value="r.value" x-text="r.value"></option>
                        </template>
                    </datalist>
                </div>
            </div>
            <div class="column is-2">
                <label class="label is-small" x-text="umaFecha"></label>
                <div class="control has-icons-left">
                    <input
                        class="input is-small"
                        type="text"
                        x-model="uma"
                        disabled="true"
                    >
                    <span class="icon is-small is-left"><i class="fa-solid fa-scale-balanced"></i></span>
                </div>
            </div>
            <div class="column is-2">
                <label class="label is-small" x-text="minPaymentFecha"></label>
                <div class="control has-icons-left">
                    <input
                        class="input is-small"
                        type="text"
                        x-model="minPayment"
                        disabled="true"
                    >
                    <span class="icon is-small is-left"><i class="fa-solid fa-sack-dollar"></i></span>
                </div>
            </div>
            <!-- SEGUNDA LINEA DE INPUTS -->
            <div class="column is-12" x-show="esBimestre">
                <label class="label is-small">Incapacidades del Mes Anterior</label>
                <div class="control has-icons-left">
                    <input
                        class="input is-small is-warning"
                        type="text"
                        placeholder="Ingresar incapacidades..."
                        x-model="prevIncapacidad"
                        @blur="prevIncapacidad = validarDiasConMesAnterior($event.target.value)"
                    >
                    <span class="icon is-small is-left"><i class="fa-solid fa-bed"></i></span>
                </div>
            </div>
            <!-- TERCERA LINEA DE INPUTS -->
            <div class="column is-6">
                <label class="label is-small">Incapacidades Mes Actual</label>
                <div class="control has-icons-left">
                    <input
                        class="input is-small is-danger"
                        type="text"
                        placeholder="Ingresar incapacidades..."
                        x-model="incapacidad"
                        @blur="incapacidad = validarDiasConMes($event.target.value)"
                    >
                    <span class="icon is-small is-left"><i class="fa-solid fa-bed"></i></span>
                </div>
            </div>
            <div class="column is-6">
                <label class="label is-small">Faltas Mes Actual</label>
                <div class="control has-icons-left">
                    <input
                        class="input is-small is-danger"
                        type="text"
                        placeholder="Ingresar faltas..."
                        x-model="faltas"
                        @blur="faltas = limitarFaltas($event.target.value)"
                    >
                    <span class="icon is-small is-left"><i class="fa-solid fa-virus"></i></span>
                </div>
            </div>
        </div>
        <div class="columns is-multiline">
            <div class="column is-12">

            </div>
            <div class="column is-6">
                <table class="table is-striped is-narrow is-hoverable is-fullwidth">
                    <thead>
                        <th>Obrero</th>
                        <th>Cantidad</th>
                    </thead>
                    <tbody>
                        <template>
                            <tr>
                                <td>...</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <div class="column is-6 ">
                <table class="table is-striped is-narrow is-hoverable is-fullwidth">
                    <thead>
                        <th>Patronal</th>
                        <th>Cantidad</th>
                    </thead>
                    <tbody>
                        <template>
                            <tr>
                                <td>...</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</main>
</body>
</html>
