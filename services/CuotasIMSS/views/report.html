<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/bulma/css/bulma.min.css">
    <link rel="stylesheet" href="/assets/css/saavedra/saavedra.css">
    <script src="https://kit.fontawesome.com/75d1a8fea1.js" crossorigin="anonymous"></script>
    <script defer src="/assets/src/utils/utils.js"></script>
    <script defer src="/assets/src/js/CuotasIMSS/cuotas_imss.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.3/dist/cdn.min.js"></script>
    <title></title>
</head>
<body x-data="CuotasIMSSReportComponent">
<section class="block hero has-background-dark">
    <nav class="navbar">
        <div class="navbar-start">
            <div class="navbar-item">
                <span class="icon-text has-text-white is-size-7 clickable" @click="goHome" style="cursor: pointer;">
                    <span class="icon"><i class="fa-solid fa-house"></i></span><span>Home</span>
                </span>
            </div>
            <div class="navbar-item">
                <span class="icon-text has-text-white is-size-7 clickable" @click="goBack" style="cursor: pointer;">
                    <span class="icon"><i class="fa-solid fa-rotate-left"></i></span><span>Volver</span>
                </span>
            </div>
            <div class="navbar-item">
                <span class="icon-text has-text-white is-size-7 clickable" @click="goCuotas" style="cursor: pointer;">
                    <span class="icon"><i class="fa-solid fa-stethoscope"></i></span><span>Servicio {{ .Service }}</span>
                </span>
            </div>
            <div class="navbar-item">
                <span class="icon-text has-text-white is-size-7">
                    <span class="icon"><i class="fa-solid fa-chart-line"></i></span><span>{{ .View1 }}</span>
                </span>
            </div>
        </div>
        <div class="navbar-end">
            <div class="navbar-item">
                <button class="button is-danger is-small" @click="logOut">
                    <span class="icon"><i class="fa-solid fa-arrow-right-from-bracket"></i></span>
                    <span>Cerrar Sesión</span>
                </button>
            </div>
        </div>
    </nav>
</section>
<main>
<section class="section">
    <div class="container">
        <div class="box">
            <div class="columns is-multiline">
                <!-- INPUTS -->
                <div class="column is-2">
                    <div class="control has-icons-left">
                        <input
                            class="input is-small is-rounded"
                            type="text"
                            placeholder="Ingresar Año del Reporte"
                            x-model="year"
                            @blur="year = yearFormat($event.target.value)"
                        >
                        <span class="icon is-small is-left"><i class="fa-solid fa-chart-bar"></i></span>
                    </div>
                </div>
                <!-- BOTONES DE ACCION -->
                <div class="column is-4">
                    <div class="buttons">
                        <button class="button is-primary is-small is-rounded is-full-width" @click="callReport" :disabled="lock">
                            <span class="icon"><i class="fa-solid fa-chart-simple"></i></span>
                            <span>Cargar Reporte</span>
                        </button>
                        <button class="button is-danger is-small is-rounded is-full-width" @click="cleanReport" :disabled="(records.length === 0)">
                            <span class="icon"><i class="fa-solid fa-pump-soap"></i></span>
                            <span>Limpiar Reporte</span>
                        </button>
                    </div>
                </div>
            </div>
            <table class="table is-striped is-narrow is-hoverable is-fullwidth">
                <thead>
                    <tr>
                        <th>Año</th>
                        <th>Mes</th>
                        <th>Empleado</th>
                        <th>Subtotal Obrero</th>
                        <th>Subtotal Patron</th>
                        <th>Total Del Mes</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="r in records">
                        <tr>
                            <td x-text="r.year"></td>
                            <td x-text="r.month"></td>
                            <td x-text="r.name"></td>
                            <td x-text="r.subtotalObrero"></td>
                            <td x-text="r.subtotalPatron"></td>
                            <td x-text="r.total"></td>
                        </tr>
                    </template>
                    <tr x-show="(records.length === 0)" class="has-text-left">
                        <td colspan="6">No se han cargado datos...</td>
                    </tr>
                </tbody>
                <tfoot x-show="(records.length > 0)">
                    <tr>
                        <th colspan="3" class="has-text-centered">Totales Acumulados del Año</th>
                        <td x-text="obreroTotal"></td>
                        <td x-text="patronTotal"></td>
                        <td x-text="totalAcumulado"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</section>
</main>
</body>
</html>
